# A Raspberry Pi OS image that boots as a RedundaNet 3 storage node: the
# agent binary, its service user and unit, and a first boot that makes the
# node's device key and hands it to the member through the boot partition
# (rpi-image/README.md). No Docker, no Python: nothing of RedundaNet 2.
#
# Built after each stable agent release (a tag agent/vX.Y.Z without a
# pre-release suffix) once that release's archives exist, by running the
# "agent release" workflow first, and attached to the same release. A manual
# run builds the image for any existing release.
name: Raspberry Pi image

on:
  workflow_run:
    workflows: ["agent release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: "agent version to build the image for, for example 3.0.0; its release must exist"
        required: true

permissions:
  contents: write

jobs:
  image:
    name: Raspberry Pi OS image, arm64
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'agent/v') && !contains(github.event.workflow_run.head_branch, '-')) }}
    # Pinned: ubuntu-latest moved to 26.04, where the ARM runner action can
    # no longer install qemu-user-static.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: the release's arm64 archive, checked against its sha256sums.txt
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then version="$INPUT_VERSION"; else version="${HEAD_BRANCH#agent/v}"; fi
          tag="agent/v$version"
          asset="redundanet-$version-linux-arm64.tar.gz"
          mkdir -p asset
          gh release download "$tag" -D asset -p "$asset" -p sha256sums.txt
          (cd asset && grep " $asset\$" sha256sums.txt | sha256sum -c)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      - name: build the image
        uses: pguyot/arm-runner-action@v2
        id: build
        with:
          base_image: https://downloads.raspberrypi.com/raspios_lite_arm64/images/raspios_lite_arm64-2026-06-19/2026-06-18-raspios-trixie-arm64-lite.img.xz
          image_additional_mb: 512
          shell: /bin/bash -eo pipefail
          commands: |
            # The checkout is copied into the image and is the working directory.
            install -d -m 0755 /usr/local/lib/redundanet3
            install -m 0755 rpi-image/firstboot.sh rpi-image/certificate.sh agent/deploy/node/install.sh /usr/local/lib/redundanet3/
            install -m 0644 agent/deploy/node/redundanet-agent.service /usr/local/lib/redundanet3/
            install -m 0644 rpi-image/redundanet3-firstboot.service rpi-image/redundanet3-certificate.service rpi-image/redundanet3-certificate.path /etc/systemd/system/
            ln -sf /usr/local/lib/redundanet3/install.sh /usr/local/sbin/redundanet-install
            install -d -m 0755 /mnt/storage
            # The node installer, with the archive verified above and no device
            # key: every booted card makes its own.
            ARCHIVE="$PWD/asset/${{ steps.rel.outputs.asset }}" NO_DEVICE_KEY=1 STORAGE_PATH=/mnt/storage CHANNEL=stable \
              bash /usr/local/lib/redundanet3/install.sh prepare "${{ steps.rel.outputs.version }}"
            /var/lib/redundanet3/bin/redundanet version
            systemctl enable redundanet3-firstboot.service redundanet3-certificate.path ssh
            id redundanet >/dev/null 2>&1 || useradd -m -s /bin/bash -G sudo redundanet
            echo "redundanet:redundanet" | chpasswd
            echo redundanet > /etc/hostname
            sed -i 's/^127\.0\.1\.1.*/127.0.1.1\tredundanet/' /etc/hosts
            install -m 0644 rpi-image/motd /etc/motd
            # Nothing of the checkout stays on the card; the directory itself is
            # left for the action's cleanup.
            cd / && find "$OLDPWD" -mindepth 1 -delete

      - name: compress and checksum
        id: img
        run: |
          set -euo pipefail
          name="redundanet-rpi-${{ steps.rel.outputs.version }}-arm64.img"
          mv "${{ steps.build.outputs.image }}" "$name"
          xz -9 -T0 "$name"
          sha256sum "$name.xz" > "$name.xz.sha256"
          cat "$name.xz.sha256"
          echo "file=$name.xz" >> "$GITHUB_OUTPUT"

      - name: keep the image as a run artifact
        uses: actions/upload-artifact@v7
        with:
          name: rpi-image-arm64
          path: |
            ${{ steps.img.outputs.file }}
            ${{ steps.img.outputs.file }}.sha256
          retention-days: 7

      - name: attach the image to the release
        # gh keeps the release as it is, draft or published; the signed index
        # never lists the image, the agent inside it updates itself.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ steps.rel.outputs.tag }}" "${{ steps.img.outputs.file }}" "${{ steps.img.outputs.file }}.sha256" --clobber
