name: Validate

# Produces the "validate" status check required by the repo ruleset
# ("Main protection"). Validates the network manifests against the schema so a
# malformed manifest can't be merged.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # Manual runs: lets a maintainer re-run the required check when a push event
  # is dropped by GitHub without crafting an empty commit.
  workflow_dispatch:

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.7.1
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install project
        run: poetry install --no-interaction

      # Two layers: the CLI validate surfaces schema errors and advisory
      # warnings; validate_pr.py enforces the hard rules (valid identities,
      # unique IPs inside the VPN range, ...) with a non-zero exit so a broken
      # manifest actually fails this required check.
      - name: Validate network manifests
        run: |
          for m in manifests/*.yaml; do
            echo "== Validating $m =="
            poetry run redundanet validate "$m"
            poetry run python .github/scripts/validate_pr.py "$m"
          done

      # The RedundaNet 3 half: the agent's strict parser and the RFC's rules,
      # then manifest.sig against the operator key. REDUNDANET_OPERATOR_KEY
      # pins that key; without the variable the check only proves the file
      # is signed by a key it lists itself.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      - name: Validate and verify the RedundaNet 3 manifest
        env:
          OPERATOR_KEY: ${{ vars.REDUNDANET_OPERATOR_KEY }}
        run: |
          cd agent
          for m in ../manifests/*.yaml; do
            grep -q '^schema: 3' "$m" || continue
            echo "== RedundaNet 3: $m =="
            go run ./cmd/redundanet validate --manifest "$m"
            sig="$(dirname "$m")/manifest.sig"
            if [ -f "$sig" ]; then
              if [ -n "$OPERATOR_KEY" ]; then
                go run ./cmd/redundanet manifest verify --manifest "$m" --sig "$sig" --trust "$OPERATOR_KEY"
              else
                go run ./cmd/redundanet manifest verify --manifest "$m" --sig "$sig"
              fi
            else
              echo "no manifest.sig beside $m: agents will not follow it until it is signed"
            fi
          done
