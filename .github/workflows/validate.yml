name: Validate

# Produces the "validate" status check required by the repo ruleset
# ("Main protection"): the manifest must pass the agent's strict parser, so
# a malformed manifest cannot be merged.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # Manual runs: lets a maintainer re-run the required check when a push event
  # is dropped by GitHub without crafting an empty commit.
  workflow_dispatch:

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The agent's strict parser and the RFC's rules, then manifest.sig
      # against the operator key. REDUNDANET_OPERATOR_KEY pins that key;
      # without the variable the check only proves the file is signed by a
      # key it lists itself.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      - name: Validate and verify the manifest
        env:
          OPERATOR_KEY: ${{ vars.REDUNDANET_OPERATOR_KEY }}
        run: |
          cd agent
          for m in ../manifests/*.yaml; do
            grep -q '^schema: 3' "$m" || continue
            echo "== $m =="
            go run ./cmd/redundanet validate --manifest "$m"
            sig="$(dirname "$m")/manifest.sig"
            if [ -f "$sig" ]; then
              if [ -n "$OPERATOR_KEY" ]; then
                go run ./cmd/redundanet manifest verify --manifest "$m" --sig "$sig" --trust "$OPERATOR_KEY"
              else
                go run ./cmd/redundanet manifest verify --manifest "$m" --sig "$sig"
              fi
            else
              echo "no manifest.sig beside $m: agents will not follow it until it is signed"
            fi
          done
