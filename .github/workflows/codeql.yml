name: CodeQL

# Analyzes Python only — run when Python (or this workflow) changes; the
# weekly schedule stays unfiltered as the safety net for new query packs.
on:
  push:
    branches: [main, develop]
    paths:
      - "src/**"
      - "tests/**"
      - "docker/entrypoints/**"
      - ".github/scripts/**"
      - "pyproject.toml"
      - ".github/workflows/codeql.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "src/**"
      - "tests/**"
      - "docker/entrypoints/**"
      - ".github/scripts/**"
      - "pyproject.toml"
      - ".github/workflows/codeql.yml"
  schedule:
    # Weekly scan (Mondays 06:00 UTC) to catch newly-published query updates.
    - cron: "0 6 * * 1"

jobs:
  analyze:
    name: Analyze (Python)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          # security-extended adds taint-tracking queries beyond the default set,
          # relevant for untrusted manifest/keyserver input reaching subprocess/file ops.
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"
