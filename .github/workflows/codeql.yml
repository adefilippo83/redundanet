name: CodeQL

# Analyzes Python only, the join pipeline's scripts: run when they (or this workflow) change; the
# weekly schedule stays unfiltered as the safety net for new query packs.
on:
  push:
    branches: [main, develop]
    paths:
      - ".github/scripts/**"
      - "pyproject.toml"
      - ".github/workflows/codeql.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - ".github/scripts/**"
      - "pyproject.toml"
      - ".github/workflows/codeql.yml"
  schedule:
    # Weekly scan (Mondays 06:00 UTC) to catch newly-published query updates.
    - cron: "0 6 * * 1"

jobs:
  analyze:
    name: Analyze (Python)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: python
          # security-extended adds taint-tracking queries beyond the default set,
          # relevant for untrusted manifest/keyserver input reaching subprocess/file ops.
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:python"
