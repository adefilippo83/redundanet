# RedundaNet 3 agent (agent/, Go). Runs on every change under agent/ on the
# three platforms the binary ships for, cross-compiles every target, and
# runs the tests of the 32-bit ARM build under emulation.
name: agent

on:
  push:
    branches: [main, develop]
    paths:
      - "agent/**"
      - ".github/workflows/agent.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "agent/**"
      - ".github/workflows/agent.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: agent

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - name: gofmt
        if: runner.os != 'Windows'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race -count=1 -cover ./...
      - run: go build ./...

  cross-compile:
    name: cross-compile
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - name: build every target
        env:
          CGO_ENABLED: "0"
          GOARM: "7"
        run: |
          set -e
          for target in linux/amd64 linux/arm64 linux/arm darwin/arm64 darwin/amd64 windows/amd64; do
            os=${target%/*}; arch=${target#*/}; ext=""; [ "$os" = windows ] && ext=.exe
            GOOS=$os GOARCH=$arch go build -trimpath -ldflags="-s -w" -o "dist/redundanet-$os-$arch$ext" ./cmd/redundanet
          done
          ls -la dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: redundanet-binaries
          path: agent/dist/
          retention-days: 7

  # No runner is 32-bit ARM, so the linux/arm build is tested under QEMU:
  # the kernel runs each test binary, and whatever a test starts, through
  # the emulator. The race detector does not exist for this target.
  test-arm:
    name: test (linux/arm, emulated)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: QEMU for 32-bit ARM
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - name: vet and test as linux/arm
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: arm
          GOARM: "7"
        run: |
          set -e
          go vet ./...
          go test -count=1 -timeout 45m ./...
