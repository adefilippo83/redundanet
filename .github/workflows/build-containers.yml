name: Build Containers

# Runs only when something that reaches the images changes. Tag builds live in
# release.yml (building here too double-built every release); docs-only pushes
# must not trigger a multi-arch build.
on:
  push:
    branches: [main]
    paths:
      - "docker/**"
      - "src/**"
      - "pyproject.toml"
      - "poetry.lock"
      - ".github/workflows/build-containers.yml"
      - ".github/workflows/tahoe-base.yml"
      - ".github/workflows/tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "docker/**"
      - "src/**"
      - "pyproject.toml"
      - "poetry.lock"
      - ".github/workflows/build-containers.yml"
      - ".github/workflows/tahoe-base.yml"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/redundanet

# One in-flight run per ref: a branch push and its later tag push must not race
# each other to re-tag :latest backwards.
concurrency:
  group: build-containers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Gate: the images (which the live fleet auto-pulls via :latest) must not be
  # built or pushed unless lint + types + unit tests pass on this exact ref.
  gate:
    name: Test gate
    uses: ./.github/workflows/tests.yml

  # The Tahoe base (Python + Tahoe + locked deps) the tahoe-* images build FROM.
  # A no-op unless poetry.lock or its Dockerfile changed since the last build.
  tahoe-base:
    name: Tahoe base image
    needs: [gate]
    uses: ./.github/workflows/tahoe-base.yml
    permissions:
      contents: read
      packages: write

  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: [gate, tahoe-base]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image:
          - tinc
          - tahoe-introducer
          - tahoe-storage
          - tahoe-client
    steps:
      - uses: actions/checkout@v7

      # QEMU for the arm64 variants. The tahoe-* images only copy files onto the
      # prebuilt base, so emulation costs seconds; tinc still installs its deps
      # under emulation (a few minutes). 64-bit only, see release.yml.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Build all target arches when publishing; keep PR validation fast (amd64).
      - name: Resolve target platforms
        id: platforms
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "list=linux/amd64" >> "$GITHUB_OUTPUT"
          else
            echo "list=linux/amd64,linux/arm64" >> "$GITHUB_OUTPUT"
          fi

      # Needed on PRs too: the base is pulled from the registry during the build.
      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.${{ matrix.image }}
          platforms: ${{ steps.platforms.outputs.list }}
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            TAHOE_BASE=${{ needs.tahoe-base.outputs.image }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=min,scope=${{ matrix.image }}

  build-base:
    name: Build Base Image
    runs-on: ubuntu-latest
    needs: [gate]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve target platforms
        id: platforms
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "list=linux/amd64" >> "$GITHUB_OUTPUT"
          else
            echo "list=linux/amd64,linux/arm64" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-base
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push base image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.base
          platforms: ${{ steps.platforms.outputs.list }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=base
          cache-to: type=gha,mode=min,scope=base

  test-compose:
    name: Test Docker Compose
    runs-on: ubuntu-latest
    needs: [build, build-base]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7

      - name: Validate docker-compose.yml
        run: docker compose -f docker/docker-compose.yml config

      - name: Validate docker-compose.dev.yml
        run: docker compose -f docker/docker-compose.yml -f docker/docker-compose.dev.yml config
