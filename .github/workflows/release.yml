name: Release

on:
  push:
    tags: ["v*"]

env:
  PYTHON_VERSION: "3.11"

jobs:
  # Gate: never publish a wheel or image for a tag whose code is red. ci.yml does
  # not run on tags, so this is the only test barrier on the release path.
  gate:
    name: Test gate
    uses: ./.github/workflows/tests.yml

  release-pypi:
    name: Release to PyPI
    runs-on: ubuntu-latest
    needs: [gate]
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2
        with:
          version: 1.7.1

      - name: Build package
        run: poetry build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true

  # The Tahoe base (Python + Tahoe + locked deps) the tahoe-* images build FROM.
  # A no-op unless poetry.lock or its Dockerfile changed since the last build.
  tahoe-base:
    name: Tahoe base image
    needs: [gate]
    uses: ./.github/workflows/tahoe-base.yml
    permissions:
      contents: read
      packages: write

  release-containers:
    name: Release Container Images
    runs-on: ubuntu-latest
    needs: [gate, tahoe-base]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image:
          - tinc
          - tahoe-introducer
          - tahoe-storage
          - tahoe-client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # QEMU for the arm64 variants. The tahoe-* images only copy files onto the
      # prebuilt base, so emulation costs seconds; tinc still installs its deps
      # under emulation (a few minutes). 64-bit only: 32-bit ARM has no prebuilt
      # wheels for Tahoe's Rust deps.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          # X.Y convenience tag (e.g. 2.7) tracking the latest patch of a minor.
          echo "MAJOR_MINOR=$(echo "$VERSION" | cut -d. -f1,2)" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.${{ matrix.image }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            TAHOE_BASE=${{ needs.tahoe-base.outputs.image }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/redundanet-${{ matrix.image }}:${{ steps.version.outputs.VERSION }}
            ghcr.io/${{ github.repository_owner }}/redundanet-${{ matrix.image }}:${{ steps.version.outputs.MAJOR_MINOR }}
            ghcr.io/${{ github.repository_owner }}/redundanet-${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=min,scope=${{ matrix.image }}

  create-github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [release-pypi, release-containers]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          # Get commits since last tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log --pretty=format:"- %s (%h)" $PREV_TAG..HEAD)
          else
            COMMITS=$(git log --pretty=format:"- %s (%h)" HEAD~10..HEAD)
          fi
          echo "COMMITS<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMITS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: RedundaNet ${{ steps.version.outputs.VERSION }}
          body: |
            ## Changes

            ${{ steps.changelog.outputs.COMMITS }}

            ## Installation

            ### PyPI
            ```bash
            pip install redundanet
            ```

            ### Docker
            ```bash
            docker pull ghcr.io/${{ github.repository_owner }}/redundanet-tinc:latest
            docker pull ghcr.io/${{ github.repository_owner }}/redundanet-tahoe-client:latest
            ```

            See the [documentation](https://github.com/${{ github.repository }}/blob/main/docs/legacy/installation.md) for full installation instructions.
          draft: false
          prerelease: ${{ contains(steps.version.outputs.VERSION, '-') }}
