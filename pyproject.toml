# The Python environment of the repository's own scripts: the join pipeline
# in .github/scripts (process_join_v3.py) and its tests. Nothing here is a
# product or a package; RedundaNet is the Go module in agent/. poetry.lock
# names every package with its hash, and the workflows install from it.
[tool.poetry]
name = "redundanet-repo-scripts"
version = "0"
description = "The Python environment of the RedundaNet repository's own scripts"
authors = ["Alessandro De Filippo"]
license = "GPL-3.0"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
pyyaml = "^6.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
ruff = ">=0.1,<0.18"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "S",      # flake8-bandit (security)
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TC",     # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "RUF",    # Ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "S603",   # subprocess call: fires on every subprocess.run(list)
    "S607",   # partial executable path: gpg, go and git are resolved via PATH on purpose
    "TC001",  # Move application import into type-checking block (breaks runtime)
    "TC002",  # Move third-party import into type-checking block (breaks runtime)
    "TC003",  # Move stdlib import into type-checking block (breaks runtime)
]

[tool.ruff.lint.per-file-ignores]
".github/scripts/tests/*.py" = ["ARG001", "ARG002", "S101", "PTH123", "S104", "S108"]

[tool.pytest.ini_options]
testpaths = [".github/scripts/tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "-ra",
]
