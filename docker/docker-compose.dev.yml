# RedundaNet Docker Compose - Development Configuration
# Use with: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# The source tree is bind-mounted over /app/src for live reload. The tahoe-*
# images derive from the published redundanet-tahoe-base image; see
# docker-compose.build.yml for building that base locally.

services:
  tinc:
    build:
      context: ..
      dockerfile: docker/Dockerfile.tinc
      target: builder
    volumes:
      - ../src:/app/src:ro
    environment:
      - REDUNDANET_DEBUG=true
      - REDUNDANET_LOG_LEVEL=DEBUG
      - REDUNDANET_TEST_MODE=true

  tahoe-introducer:
    build:
      context: ..
      dockerfile: docker/Dockerfile.tahoe-introducer
      args:
        TAHOE_BASE: ${TAHOE_BASE:-ghcr.io/adefilippo83/redundanet-tahoe-base:latest}
    volumes:
      - ../src:/app/src:ro
    environment:
      - REDUNDANET_DEBUG=true
      - REDUNDANET_LOG_LEVEL=DEBUG

  tahoe-storage:
    build:
      context: ..
      dockerfile: docker/Dockerfile.tahoe-storage
      args:
        TAHOE_BASE: ${TAHOE_BASE:-ghcr.io/adefilippo83/redundanet-tahoe-base:latest}
    volumes:
      - ../src:/app/src:ro
    environment:
      - REDUNDANET_DEBUG=true
      - REDUNDANET_LOG_LEVEL=DEBUG

  tahoe-client:
    build:
      context: ..
      dockerfile: docker/Dockerfile.tahoe-client
      args:
        TAHOE_BASE: ${TAHOE_BASE:-ghcr.io/adefilippo83/redundanet-tahoe-base:latest}
    volumes:
      - ../src:/app/src:ro
    environment:
      - REDUNDANET_DEBUG=true
      - REDUNDANET_LOG_LEVEL=DEBUG
