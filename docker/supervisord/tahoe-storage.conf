[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid
user=root

[program:tahoe-storage]
command=/bin/bash -c "python /app/entrypoint.py && rm -f /var/lib/tahoe-storage/running.process /var/lib/tahoe-storage/twistd.pid && exec tahoe run /var/lib/tahoe-storage"
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Serves this node's share census (opaque storage indexes) on the VPN IP only,
; so the hub's status page can compute per-object replication.
[program:share-census]
command=/bin/bash -c "python /app/share_census.py"
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
