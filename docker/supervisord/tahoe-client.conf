[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid
user=root

[program:tahoe-client]
command=/bin/bash -c "python /app/entrypoint.py && rm -f /var/lib/tahoe-client/running.process /var/lib/tahoe-client/twistd.pid && exec tahoe run /var/lib/tahoe-client"
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Renews the leases of all aliases weekly so storage-side garbage collection
; (expire.override_lease_duration) never collects live data.
[program:lease-renew]
command=/bin/sh /app/lease_renew.sh
autostart=true
autorestart=true
startsecs=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Automatic re-encoder: converges stored files to the current k-of-n after an
; encoding change in the manifest. Strict no-op when everything matches.
[program:rebalance]
command=python /app/rebalance.py
autostart=true
autorestart=true
startsecs=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; One-way async backup of a local directory (e.g. a Samba share on the host)
; into the grid via `tahoe backup`. No-op unless SYNC_ENABLED=true in .env.
[program:backup-sync]
command=python /app/backup_sync.py
autostart=true
autorestart=true
startsecs=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
