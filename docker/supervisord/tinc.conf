[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid
user=root

[program:tinc]
command=/bin/bash -c "python /app/entrypoint.py"
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Periodically re-syncs the manifest and refreshes peer host files, then HUPs
; tincd — this is how joins/revocations reach running nodes without a restart.
[program:manifest-sync]
command=/bin/bash -c "python /app/manifest_sync.py"
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
