[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid
user=root

; Tinc VPN: the entrypoint derives the Tinc key from the node's GPG key,
; builds peer host files from the manifest, then execs tincd.
[program:tinc]
command=/bin/bash -c "python /app/entrypoint.py"
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Periodically re-syncs the manifest and refreshes peer host files, then HUPs
; tincd — this is how joins/revocations reach the hub without a restart.
[program:manifest-sync]
command=/bin/bash -c "python /app/manifest_sync.py"
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Tahoe introducer: the entrypoint waits for the VPN interface, writes
; tahoe.cfg, then tahoe runs the introducer (state on the mounted volume).
[program:tahoe-introducer]
command=/bin/bash -c "python /app/introducer_entrypoint.py && exec tahoe run /var/lib/tahoe-introducer"
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Copies the generated FURL into the shared manifest dir once it exists (the
; operator reads it from here to publish introducer_furl in the manifest).
[program:furl-publish]
command=/bin/bash -c "while [ ! -s /var/lib/tahoe-introducer/private/introducer.furl ]; do sleep 2; done; install -d /var/lib/redundanet/manifest; cp /var/lib/tahoe-introducer/private/introducer.furl /var/lib/redundanet/manifest/introducer.furl; echo \"Published introducer FURL: $(cat /var/lib/redundanet/manifest/introducer.furl)\"; sleep infinity"
autostart=true
autorestart=true
startsecs=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
