# fly.io deployment for the RedundaNet bootstrap hub (Tinc entry node +
# Tahoe introducer). Full runbook: docs/bootstrap-hub.md
#
# UDP note: tinc prefers UDP but fly.io's UDP routing requires binding the
# special fly-global-services address, which tincd does not do. Only 655/tcp is
# exposed; tinc falls back to TCP automatically, which is fine for a
# rendezvous/relay hub.

app = "redundanet-hub"
primary_region = "fra"

[build]
  dockerfile = "docker/Dockerfile.bootstrap"

[env]
  REDUNDANET_NODE_NAME = "hub-fly"
  REDUNDANET_INTERNAL_VPN_IP = "10.100.0.1"
  # Set to the dedicated IPv4 after `fly ips allocate-v4` (auto-detection from
  # inside the machine sees the egress IP, not the anycast address; harmless
  # for the hub itself — peers use the manifest's public_ip — but explicit is
  # cleaner).
  REDUNDANET_PUBLIC_IP = "auto"
  REDUNDANET_MANIFEST_REPO = "https://github.com/adefilippo83/redundanet.git"
  REDUNDANET_MANIFEST_BRANCH = "main"
  REDUNDANET_SYNC_INTERVAL = "300"
  REDUNDANET_LOG_LEVEL = "INFO"

# The introducer's tub identity + FURL live here and MUST survive restarts —
# losing this volume changes the FURL and strands every node until the
# manifest is updated. Snapshot it (see runbook).
[[mounts]]
  source = "introducer_data"
  destination = "/var/lib/tahoe-introducer"

[[services]]
  protocol = "tcp"
  internal_port = 655
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 655

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
