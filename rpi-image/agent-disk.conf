# RedundaNet 3 Raspberry Pi image, a drop-in for redundanet-agent.service:
# the store lives on the disk labeled REDUNDANET, which /etc/fstab mounts at
# /mnt/storage whenever it is attached. The agent runs only while that disk
# is mounted, so shares never land on the SD card, and it makes the store
# directory on the disk as it starts (as root, outside its sandbox).
[Unit]
RequiresMountsFor=/mnt/storage
ConditionPathIsMountPoint=/mnt/storage

[Service]
ExecStartPre=+/usr/bin/install -d -o redundanet3 -g redundanet3 -m 0750 /mnt/storage/redundanet3
